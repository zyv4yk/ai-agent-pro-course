[project]
name = "f1-oracle"
version = "0.1.0"
description = "AI-агент, що прогнозує переможця наступної гонки Формули-1"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4,<2",
    "langchain-anthropic>=1.7,<2",
    "httpx>=0.28",
    "pydantic>=2.11",
    "python-dotenv>=1.1",
    "rich>=14",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
f1-oracle = "f1_oracle.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1_oracle"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
